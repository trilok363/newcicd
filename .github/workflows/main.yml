name : Test and build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@4

      - name: Use Node.js
        uses: actions/setup-node@4
        with:
          node-version : 16

      - name : Install Dependencies
        run : npm ci
        
      - name : run lint
        run : npm run lint

